<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>バスシミュレーター</title>
<link rel="stylesheet" href="style.css">
<script>
window.addEventListener("error", function (e) {
  var text = e.message;
  if (e.target && e.target.src) {
    text = "読み込み失敗: " + e.target.src + "（このファイル、またはこれが読み込む別のファイルが見つからないか、壊れています）";
  }
  var box = document.createElement("pre");
  box.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:999;margin:0;padding:8px;background:#7a1f1f;color:#fff;font-size:12px;white-space:pre-wrap";
  box.textContent = text;
  document.body.appendChild(box);
}, true);
</script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body>
<div id="rotate-notice">
<p>画面を横向きにしてください</p>
</div>
<div id="screen-title" class="screen">
<h1>バスシミュレーター</h1>
<p id="title-coins" class="coins">所持コイン：0</p>
<div class="menu">
<button data-mode="career">キャリアモード</button>
<button data-mode="daily">デイリーモード</button>
<button data-mode="free">フリーモード</button>
<button data-screen="shop">ショップ</button>
<button data-screen="settings">設定</button>
</div>
</div>
<div id="screen-courses" class="screen">
<h2>コース選択</h2>
<div class="course-list" id="course-list"></div>
<div class="menu single">
<button data-screen="title">もどる</button>
</div>
</div>
<div id="screen-result" class="screen">
<h2 id="result-title">ルート完了！</h2>
<div class="result-box">
<div class="result-row"><span>基本のコイン</span><span id="result-base">0</span></div>
<div class="result-row"><span>ルートの長さ</span><span id="result-length">0 m</span></div>
<div class="result-row"><span>倍率</span><span id="result-mult">×1.0</span></div>
<div class="result-row total"><span>合計</span><span id="result-total">0</span></div>
<div class="result-row"><span>所持コイン</span><span id="result-coins">0</span></div>
</div>
<div class="menu two">
<button id="btn-retry">もう一度</button>
<button data-screen="title">タイトルへ</button>
</div>
</div>
<div id="screen-shop" class="screen">
<div class="shop-header">
<button class="small" data-screen="title">もどる</button>
<h2>ショップ</h2>
<span id="shop-coins" class="coins">所持コイン：0</span>
</div>
<p id="shop-message" class="shop-message"></p>
<div class="shop-list" id="shop-list"></div>
</div>
<div id="screen-settings" class="screen">
<h2>設定</h2>
<div class="setting-row">
<span>操作方式</span>
<div class="segment">
<button data-control="button">ボタン操作</button>
<button data-control="wheel">ハンドル操作</button>
</div>
</div>
<div class="menu single">
<button data-screen="title">もどる</button>
</div>
</div>
<div id="screen-game" class="screen">
<canvas id="game-canvas"></canvas>
<div id="game-hud">
<div class="hud-group">
<button class="small" data-screen="title">もどる</button>
<span class="hud-pill" id="game-mode-name"></span>
</div>
<div class="hud-group">
<button class="small" id="btn-camera">視点切替</button>
<button class="small" id="btn-control">操作切替</button>
</div>
<div class="hud-group center">
<span class="blinker-ind" id="blinker-left">◀</span>
<span class="hud-pill" id="speed-display">0 km/h</span>
<span class="hud-pill" id="run-coins">コイン 0</span>
<span class="hud-pill" id="passenger-count">乗客 0</span>
<span class="hud-pill" id="route-info"></span>
<span class="blinker-ind" id="blinker-right">▶</span>
</div>
</div>
<div id="toast"></div>
<div id="drive-controls">
<div class="pad">
<div class="pad" id="steer-buttons">
<button class="drive-btn" id="btn-left">◀</button>
<button class="drive-btn" id="btn-right">▶</button>
</div>
<div id="steer-wheel"><span id="steer-marker"></span></div>
</div>
<div class="pad" id="blinker-pad">
<button class="drive-btn blinker" id="btn-blink-left">◀左</button>
<button class="drive-btn blinker" id="btn-blink-right">右▶</button>
</div>
<div class="pad">
<button class="drive-btn brake" id="btn-brake">ブレーキ</button>
<button class="drive-btn accel" id="btn-accel">アクセル</button>
</div>
</div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
